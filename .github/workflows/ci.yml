name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        run: pytest -v

      # Proves the gateway runs with no outbound network access, which is the
      # core requirement for airgapped / disconnected deployments. The suite
      # includes tests/test_no_egress.py, which bans all socket creation and
      # then drives the full pipeline.
      - name: Airgap check (no network egress)
        run: pytest -v tests/test_no_egress.py
